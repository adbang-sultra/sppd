<!DOCTYPE html>
<html lang="id" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>SIM Pegawai &amp; SPPD</title>
<link rel="icon" id="fav" href="assets/logo.svg">
<link rel="stylesheet" href="css/tw.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/doc.css">
</head>
<body>
<noscript><div class="nojs">Aplikasi ini memerlukan JavaScript.</div></noscript>

<!-- Latar: gambar + lapisan warna + kanvas efek interaktif -->
<div id="bgwrap" aria-hidden="true"><div id="bgimg"></div><div id="bgtint"></div><canvas id="fx"></canvas></div>

<!-- Layar masuk -->
<div id="login" hidden></div>

<!-- Aplikasi -->
<div id="app" hidden>
  <aside id="side" aria-label="Menu utama">
    <div class="brand"><img class="brandLogo" alt=""><span class="lb brandName"></span><button class="ib only-lg" data-act="togSide" aria-label="Ciutkan menu"><span data-ico="chevl"></span></button></div>
    <nav id="nav"></nav>
    <div class="side-foot lb"><span id="sideUser"></span></div>
  </aside>
  <div id="scrim" data-act="closeDrawers"></div>
  <div id="col">
    <header id="top">
      <button class="ib only-sm" data-act="togSide" aria-label="Menu"><span data-ico="menu"></span></button>
      <div class="ttl"><div id="bc"></div><h1 id="pgTitle"></h1></div>
      <button class="ib" data-act="palette" aria-label="Cari menu (Ctrl+K)" title="Cari menu (Ctrl+K)"><span data-ico="search"></span></button>
      <button class="ib" data-act="togMode" aria-label="Mode terang/gelap" title="Mode terang/gelap"><span data-ico="moon"></span></button>
      <button class="ib" data-act="togRP" aria-label="Profil instansi" title="Profil instansi"><span data-ico="info"></span></button>
      <button class="uchip" id="uchip" data-act="pwEdit" title="Akun saya"></button>
      <button class="ib danger" data-act="logout" aria-label="Keluar" title="Keluar"><span data-ico="logout"></span></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <aside id="rp" class="hide" aria-label="Profil instansi"></aside>
  <nav id="bnav" aria-label="Navigasi bawah"></nav>
</div>

<div id="mod"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="pa"></div>
<input type="file" id="fcsv" accept=".csv,text/csv" hidden>
<input type="file" id="fjson" accept=".json,application/json" hidden>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/fx.js"></script>
<script src="js/app.js"></script>
<script src="js/report.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
